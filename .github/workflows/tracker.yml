name: Daily Conqueror Tracker

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Enables manual run button in GitHub UI

permissions:
  contents: write # Needed to commit state changes back to repo

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Tracker Script
        env:
          COC_TOKEN: ${{ secrets.COC_TOKEN }}
        run: python tracker.py

      - name: Auto-commit updated statistics
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: auto-update conqueror attack ledger"
          file_pattern: "conqueror_data.json README.md"
